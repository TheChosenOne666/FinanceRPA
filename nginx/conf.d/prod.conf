# nginx/conf.d/prod.conf
# FinanceRPA 生产环境反向代理配置（覆盖 default.conf）
#
# 与 default.conf 的区别：
# 1. 启用 HTTPS（443 端口 + SSL 证书）
# 2. HTTP 80 → HTTPS 443 强制重定向
# 3. 增加 HTTP 安全头（HSTS、X-Frame-Options、CSP 等）
# 4. /healthz 健康检查端点（nginx 自身，不代理后端）
#
# SSL 证书路径：/etc/nginx/ssl/（由 docker-compose.prod.yml 挂载 ./nginx/ssl/）
# 证书文件：server.crt + server.key（自签生成或 Let's Encrypt，见 docs/deployment.md）

upstream backend {
    server finance-backend:8080;
    keepalive 32;
}

upstream ai_service {
    server finance-ai:8000;
    keepalive 32;
}

upstream frontend {
    server finance-frontend:80;
    keepalive 16;
}

# ========== HTTP → HTTPS 强制重定向 ==========
server {
    listen 80;
    server_name _;

    # 健康检查端点（nginx 自身，返回 200，不代理后端）
    location /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # 其余请求 301 重定向到 HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ========== HTTPS 主入口 ==========
server {
    listen 443 ssl;
    http2 on;
    server_name _;

    # ===== SSL 证书配置 =====
    ssl_certificate     /etc/nginx/ssl/server.crt;
    ssl_certificate_key /etc/nginx/ssl/server.key;

    # TLS 协议与加密套件（禁用 TLSv1.0/1.1，仅启用 1.2/1.3）
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers on;
    # 会话缓存（10m 共享内存约 4 万连接，1d 超时）
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # ===== HTTP 安全头 =====
    # HSTS：强制浏览器后续使用 HTTPS（max-age=31536000=1年，含子域名，预加载列表）
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    # 禁止被嵌入 iframe（防止点击劫持）
    add_header X-Frame-Options "SAMEORIGIN" always;
    # 禁止 MIME 类型嗅探
    add_header X-Content-Type-Options "nosniff" always;
    # 启用浏览器 XSS 过滤器
    add_header X-XSS-Protection "1; mode=block" always;
    # Referrer 策略：仅同源发送 Referrer
    add_header Referrer-Policy "same-origin" always;
    # 内容安全策略（允许同源 + 内联样式/脚本，生产可按需收紧）
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'self'" always;

    # 客户端请求体大小（文件上传，M7.2 审计截图 multipart 上传）
    client_max_body_size 100m;

    # ========== AI 服务 SSE 透传（必须优先匹配） ==========
    # SSE 流：关闭缓冲，保证实时推送
    location /api/v1/ai/sse/ {
        proxy_pass http://ai_service;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE 关键配置
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection '';
        proxy_read_timeout 86400s;
        chunked_transfer_encoding on;
    }

    # ========== AI 服务其他接口 → Java 后端转发（统一鉴权） ==========
    location /api/v1/ai/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ========== Java 后端 API ==========
    # 后端 server.servlet.context-path: /api，proxy_pass 需加上 /api 前缀
    location /api/ {
        proxy_pass http://backend/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ========== 前端静态资源 ==========
    location / {
        proxy_pass http://frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
