# nginx/conf.d/default.conf
# FinanceRPA 反向代理配置（按系统设计 10.3 路由策略）

upstream backend {
    server finance-backend:8080;
}

upstream ai_service {
    server finance-ai:8000;
}

upstream frontend {
    server finance-frontend:8081;
}

server {
    listen 80;
    server_name _;

    # 客户端请求体大小（文件上传）
    client_max_body_size 100m;

    # ========== AI 服务 SSE 透传（必须优先匹配） ==========
    # SSE 流：关闭缓冲，保证实时推送
    location /api/v1/ai/sse/ {
        proxy_pass http://ai_service;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE 关键配置
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection '';
        proxy_read_timeout 86400s;
        chunked_transfer_encoding on;
    }

    # ========== AI 服务其他接口 → Java 后端转发（统一鉴权） ==========
    location /api/v1/ai/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ========== Java 后端 API ==========
    location /api/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # actuator 健康检查（仅内网，生产环境可关闭）
    location /actuator/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ========== 前端静态资源 ==========
    location / {
        proxy_pass http://frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # WebSocket 支持（Vite HMR）
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
