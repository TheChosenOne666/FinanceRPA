# mock-bank/nginx.conf
# M9.1 E2E 测试用 mock 银行/保险/证券业务页面托管
# 供 Skyvern 容器内通过 http://mock-bank 访问

server {
    listen 80;
    server_name _;

    # 静态页面根目录
    root /usr/share/nginx/html;
    index index.html;

    # 默认字符集（中文页面）
    charset utf-8;

    # 场景静态页（scenario1.html ~ scenario6.html）
    location / {
        try_files $uri $uri/ =404;
    }

    # 健康检查（供 docker-compose healthcheck 使用）
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
