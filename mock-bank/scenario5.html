<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>保险业务系统 - 理赔审核</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: "Microsoft YaHei", "PingFang SC", sans-serif; background: #f5f7fa; color: #1f2937; padding: 20px; }
    .container { max-width: 680px; margin: 0 auto; background: #fff; border-radius: 8px; box-shadow: 0 1px 3px rgba(0,0,0,.1); overflow: hidden; }
    header { background: #047857; color: #fff; padding: 16px 24px; }
    header h1 { font-size: 18px; }
    main { padding: 24px; }
    section h2 { font-size: 16px; color: #374151; margin-bottom: 16px; padding-bottom: 8px; border-bottom: 1px solid #e5e7eb; }
    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; font-size: 14px; color: #374151; margin-bottom: 6px; font-weight: 500; }
    .form-group input, .form-group textarea { width: 100%; padding: 8px 12px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 14px; font-family: inherit; }
    .form-group textarea { min-height: 80px; resize: vertical; }
    .form-group input:focus, .form-group textarea:focus { outline: none; border-color: #047857; box-shadow: 0 0 0 3px rgba(4,120,87,.1); }
    button { background: #047857; color: #fff; border: none; padding: 10px 24px; border-radius: 6px; font-size: 14px; cursor: pointer; font-weight: 500; }
    button:hover { background: #036049; }
    button.secondary { background: #fff; color: #047857; border: 1px solid #047857; }
    button.secondary:hover { background: #f0fdf4; }
    .logged-user { font-size: 13px; color: #6b7280; margin-bottom: 16px; }
    .btn-row { margin-bottom: 16px; }
    .download-status { font-size: 13px; color: #6b7280; margin-top: 8px; }
    .result { margin-top: 16px; padding: 12px; border-radius: 6px; font-size: 14px; }
    .result-success { background: #ecfdf5; color: #065f46; border: 1px solid #a7f3d0; }
  </style>
</head>
<body>
  <div class="container">
    <header><h1>保险业务系统 · 理赔审核</h1></header>
    <main>
      <!-- 登录区 -->
      <section id="login-section">
        <h2>用户登录</h2>
        <form id="login-form">
          <div class="form-group">
            <label for="username">用户名</label>
            <input id="username" type="text" placeholder="请输入用户名" required>
          </div>
          <div class="form-group">
            <label for="password">密码</label>
            <input id="password" type="password" placeholder="请输入密码" required>
          </div>
          <button type="submit">登录</button>
        </form>
      </section>

      <!-- 业务区 -->
      <section id="business-section" hidden>
        <p class="logged-user">当前用户：<span id="current-user">-</span></p>
        <h2>理赔审核提交</h2>
        <div class="btn-row">
          <button type="button" id="download-btn" class="secondary">下载理赔材料</button>
          <div id="download-status" class="download-status" hidden>理赔材料已下载</div>
        </div>
        <form id="claim-form">
          <div class="form-group">
            <label for="claim-number">理赔编号</label>
            <input id="claim-number" type="text" placeholder="请输入理赔编号">
          </div>
          <div class="form-group">
            <label for="claim-amount">理赔金额</label>
            <input id="claim-amount" type="text" placeholder="请输入理赔金额（元）">
          </div>
          <div class="form-group">
            <label for="reviewer-comment">审核意见</label>
            <textarea id="reviewer-comment" placeholder="请输入审核意见"></textarea>
          </div>
          <button type="button" id="submit-btn">提交审核结果</button>
        </form>
        <div id="result" class="result result-success" hidden></div>
      </section>
    </main>
  </div>

  <script>
    // 登录
    document.getElementById('login-form').addEventListener('submit', function(e) {
      e.preventDefault();
      var u = document.getElementById('username').value;
      document.getElementById('current-user').textContent = u;
      document.getElementById('login-section').hidden = true;
      document.getElementById('business-section').hidden = false;
    });

    // 下载理赔材料：生成 PDF 并触发下载
    document.getElementById('download-btn').addEventListener('click', function() {
      var pdf = '%PDF-1.4\n1 0 obj<</Type/Catalog/Pages 2 0 R>>endobj\n2 0 obj<</Type/Pages/Kids[3 0 R]/Count 1>>endobj\n3 0 obj<</Type/Page/Parent 2 0 R/MediaBox[0 0 612 792]/Contents 4 0 R>>endobj\n4 0 obj<</Length 120>>stream\nBT /F1 12 Tf 50 750 Td (理赔材料清单) Tj 0 -20 Td (1. 理赔申请书) Tj 0 -20 Td (2. 医疗费用凭证) Tj 0 -20 Td (3. 事故证明) Tj ET\nendstream\nendobj\nxref\n0 5\n0000000000 65535 f \n0000000009 00000 n \n0000000058 00000 n \n0000000115 00000 n \n0000000196 00000 n \ntrailer<</Size 5/Root 1 0 R>>\nstartxref\n366\n%%EOF';
      var blob = new Blob([pdf], { type: 'application/pdf' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = '理赔材料清单.pdf';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      document.getElementById('download-status').hidden = false;
    });

    document.getElementById('submit-btn').addEventListener('click', function() {
      var num = document.getElementById('claim-number').value;
      var amt = document.getElementById('claim-amount').value;
      var comment = document.getElementById('reviewer-comment').value;
      var r = document.getElementById('result');
      r.textContent = '理赔审核已提交：编号 ' + num + '，金额 ' + amt + ' 元，审核意见：' + comment;
      r.hidden = false;
    });
  </script>
</body>
</html>
