# application-dev.yml
# 开发环境配置（Docker Compose 环境）
# 启用：数据源 / MyBatis-Plus / Redis / Actuator
# 禁用：Flyway（M0.3 启用）/ Security（M1.1 启用）

spring:
  # 覆盖 application.yml 的排除列表：仅保留 Security 排除
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration
      - org.springframework.boot.autoconfigure.security.servlet.SecurityFilterAutoConfiguration
      - org.springframework.boot.actuate.autoconfigure.security.servlet.ManagementWebSecurityAutoConfiguration
  # PostgreSQL 数据源
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/finrpa}
    username: ${SPRING_DATASOURCE_USERNAME:finrpa}
    password: ${SPRING_DATASOURCE_PASSWORD:finrpa}
    driver-class-name: org.postgresql.Driver
  # Redis
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      timeout: 5000ms
  # Flyway 暂时禁用（M0.3 数据库迁移脚本初始化后启用）
  flyway:
    enabled: false

# 开发环境开启 SQL 日志
mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

logging:
  level:
    com.finrpa: DEBUG
    org.springframework.web: DEBUG
