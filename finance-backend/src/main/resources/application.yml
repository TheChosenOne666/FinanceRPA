server:
  port: 8080
  shutdown: graceful
  servlet:
    context-path: /api

spring:
  application:
    name: finance-backend
  # Java 21 虚拟线程启用（对齐 tech-stack ADR-005）
  threads:
    virtual:
      enabled: true
  # 文件上传配置（M7.2 审计截图 multipart 上传，PNG 截图通常 2-5MB）
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 15MB
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.jdbc.DataSourceTransactionManagerAutoConfiguration
      - com.baomidou.mybatisplus.autoconfigure.MybatisPlusAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
      - org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration
      - org.springframework.boot.autoconfigure.security.servlet.SecurityFilterAutoConfiguration
      - org.springframework.boot.autoconfigure.security.reactive.ReactiveSecurityAutoConfiguration
      - org.springframework.boot.actuate.autoconfigure.security.servlet.ManagementWebSecurityAutoConfiguration

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
  info:
    env:
      enabled: true

info:
  app:
    name: finance-backend
    description: FinanceRPA Java 后端 - 企业管理与编排服务
    version: 0.0.1-SNAPSHOT

logging:
  level:
    root: INFO
    com.finrpa: DEBUG
    org.springframework: INFO

# MyBatis-Plus 配置（M0.2 启用数据源后生效）
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# springdoc-openapi 配置
springdoc:
  group-configs:
    - group: 'default'
      packages-to-scan: com.finrpa

# JWT 配置
jwt:
  secret: finrpa-finance-rpa-jwt-secret-key-2026-longer-than-256-bits
  access-token-expire-minutes: 60
  refresh-token-expire-days: 7

# Fernet 加密配置（M3.4 工作流敏感参数加密，与 Python cryptography 字节级兼容）
fernet:
  # 32 字节密钥的 Base64url 编码，生产环境必须通过环境变量 FERNET_KEY 注入
  key: ${FERNET_KEY:Mfm6N6AzRZDx8U1zIlbYj64Sfh69sNQnr2eK6mGGjC4=}

# 批量数据驱动：外部业务系统数据源（只读，用于从数据库拉取客户清单批量生成任务）
external-datasource:
  # 是否启用外部数据源对接（生产按需开启，避免无谓连接）
  enabled: ${EXTERNAL_DS_ENABLED:false}
  # JDBC URL，例如 jdbc:postgresql://host:5432/crm
  url: ${EXTERNAL_DS_URL:}
  # 驱动类（postgresql / mysql 二选一）
  driver-class-name: ${EXTERNAL_DS_DRIVER:org.postgresql.Driver}
  username: ${EXTERNAL_DS_USERNAME:}
  password: ${EXTERNAL_DS_PASSWORD:}

# AI 服务配置（Java → Python HTTP 客户端 + SSE 透传）
ai:
  # Python finance-ai 服务基础地址
  base-url: ${AI_BASE_URL:http://localhost:8000}
  # 服务间共享密钥（X-Internal-Token Header）
  internal-token: ${AI_INTERNAL_TOKEN:finrpa-internal-secret}
  # 连接超时（秒）
  connect-timeout: 5
  # 读取超时（秒）—— 同步调用场景
  read-timeout: 60
  # SSE 长连接超时（秒）—— 默认 1 小时
  sse-timeout: 3600
  # 重试配置
  retry:
    max-attempts: 3
    # 初始退避（毫秒），指数递增
    backoff: 1000

# 通知模块配置（M6.6 企业微信/钉钉群机器人 Webhook）
notification:
  # 企业微信群机器人
  wecom:
    # Webhook URL（空表示未配置；生产环境通过 WECOM_WEBHOOK_URL 环境变量注入）
    webhook-url: ${WECOM_WEBHOOK_URL:}
  # 钉钉群机器人
  dingtalk:
    # Webhook URL（空表示未配置；生产环境通过 DINGTALK_WEBHOOK_URL 环境变量注入）
    webhook-url: ${DINGTALK_WEBHOOK_URL:}
    # 加签密钥（启用加签模式时必填；生产环境通过 DINGTALK_SECRET 环境变量注入）
    secret: ${DINGTALK_SECRET:}

# MinIO 对象存储配置（M7.2 审计截图存储）
minio:
  # MinIO 服务地址（含协议与端口）
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  # 访问密钥
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  # 秘密密钥
  secret-key: ${MINIO_SECRET_KEY:minioadmin}
  # Bucket 前缀，完整 bucket 名为 {prefix}{org_id}（系统设计 6.4.4）
  bucket-prefix: ${MINIO_BUCKET_PREFIX:finrpa-audit-}
  # 预签名 URL 有效期（小时，系统设计 6.4.4 约定 1 小时）
  presign-expiry-hours: ${MINIO_PRESIGN_EXPIRY_HOURS:1}
  # 截图保留期（天，系统设计 6.4.4 约定 90 天）
  retention-days: ${MINIO_RETENTION_DAYS:90}
