server:
  port: 8080
  shutdown: graceful
  servlet:
    context-path: /api

spring:
  application:
    name: finance-backend
  # Java 21 虚拟线程启用（对齐 tech-stack ADR-005）
  threads:
    virtual:
      enabled: true
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.jdbc.DataSourceTransactionManagerAutoConfiguration
      - com.baomidou.mybatisplus.autoconfigure.MybatisPlusAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
      - org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration
      - org.springframework.boot.autoconfigure.security.servlet.SecurityFilterAutoConfiguration
      - org.springframework.boot.autoconfigure.security.reactive.ReactiveSecurityAutoConfiguration
      - org.springframework.boot.actuate.autoconfigure.security.servlet.ManagementWebSecurityAutoConfiguration

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
  info:
    env:
      enabled: true

info:
  app:
    name: finance-backend
    description: FinanceRPA Java 后端 - 企业管理与编排服务
    version: 0.0.1-SNAPSHOT

logging:
  level:
    root: INFO
    com.finrpa: DEBUG
    org.springframework: INFO

# MyBatis-Plus 配置（M0.2 启用数据源后生效）
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# springdoc-openapi 配置
springdoc:
  group-configs:
    - group: 'default'
      packages-to-scan: com.finrpa

# JWT 配置
jwt:
  secret: finrpa-finance-rpa-jwt-secret-key-2026-longer-than-256-bits
  access-token-expire-minutes: 60
  refresh-token-expire-days: 7

# Fernet 加密配置（M3.4 工作流敏感参数加密，与 Python cryptography 字节级兼容）
fernet:
  # 32 字节密钥的 Base64url 编码，生产环境必须通过环境变量 FERNET_KEY 注入
  key: ${FERNET_KEY:Mfm6N6AzRZDx8U1zIlbYj64Sfh69sNQnr2eK6mGGjC4=}

# AI 服务配置（Java → Python HTTP 客户端 + SSE 透传）
ai:
  # Python finance-ai 服务基础地址
  base-url: ${AI_BASE_URL:http://localhost:8000}
  # 服务间共享密钥（X-Internal-Token Header）
  internal-token: ${AI_INTERNAL_TOKEN:finrpa-internal-secret}
  # 连接超时（秒）
  connect-timeout: 5
  # 读取超时（秒）—— 同步调用场景
  read-timeout: 60
  # SSE 长连接超时（秒）—— 默认 1 小时
  sse-timeout: 3600
  # 重试配置
  retry:
    max-attempts: 3
    # 初始退避（毫秒），指数递增
    backoff: 1000

# 通知模块配置（M6.6 企业微信/钉钉群机器人 Webhook）
notification:
  # 企业微信群机器人
  wecom:
    # Webhook URL（空表示未配置；生产环境通过 WECOM_WEBHOOK_URL 环境变量注入）
    webhook-url: ${WECOM_WEBHOOK_URL:}
  # 钉钉群机器人
  dingtalk:
    # Webhook URL（空表示未配置；生产环境通过 DINGTALK_WEBHOOK_URL 环境变量注入）
    webhook-url: ${DINGTALK_WEBHOOK_URL:}
    # 加签密钥（启用加签模式时必填；生产环境通过 DINGTALK_SECRET 环境变量注入）
    secret: ${DINGTALK_SECRET:}
