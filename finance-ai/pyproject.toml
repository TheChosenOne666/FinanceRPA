[project]
name = "finance-ai"
version = "0.0.1"
description = "FinanceRPA Python AI 服务 - 浏览器自动化与 LLM 编排"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
authors = [{ name = "FinanceRPA" }]

dependencies = [
    # === finance-ai 基础 ===
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "structlog>=24.4.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "httpx>=0.28.0",
    "redis>=5.2.0",
    "tenacity>=9.0.0",
    "sse-starlette>=2.2.0",
    "cryptography>=43.0.0",
    # === Skyvern core 依赖（M3.7 引入） ===
    "starlette>=0.46.2,<1",
    "alembic>=1.13.1,<2",
    "psycopg[binary]>=3.1.18,<4",
    "openai>=1.66.5,<2",
    "litellm>=1.55.0,<1.90.0",
    "anthropic>=0.50.0,<0.51",
    "playwright>=1.46.0,<2",
    "aiohttp>=3.9.3,<4",
    "aiofiles>=23.2.1,<24",
    "websockets>=12.0,<14",
    "orjson>=3.10.0,<4",
    "jinja2>=3.1.3,<4",
    "python-dotenv>=1.0.1,<2",
    "python-multipart>=0.0.9,<1",
    "aioboto3>=12.3.0,<14",
    # === OpenTelemetry（Skyvern 分布式追踪用） ===
    "opentelemetry-api>=1.28.0,<2",
    "opentelemetry-sdk>=1.28.0,<2",
    "opentelemetry-semantic-conventions>=0.50b0",
    # === Skyvern 隐式依赖（analytics/CLI/类型存根/curl 解析） ===
    "typer>=0.27.0,<1",
    "posthog>=3.0.0,<4",
    "pillow>=10.0.0,<13",
    "curlparser>=0.1.0,<1",
    "types-boto3-batch>=1.34.0",
    "types-boto3-ec2>=1.34.0",
    "types-boto3-ecs>=1.34.0",
    "types-boto3-s3>=1.34.0",
    "types-boto3-secretsmanager>=1.34.0",
    # === JWT（Skyvern security 模块用） ===
    "python-jose[cryptography]>=3.3.0,<4",
    # === 文档处理（Skyvern workflow block 用） ===
    "python-docx>=1.1.0,<2",
    # === Skyvern 隐式依赖（文件类型识别 / JSON 修复 / 数据处理 / 解析器） ===
    "filetype>=1.2.0,<2",
    "json-repair>=0.30.0,<1",
    "pandas>=2.2.0,<3",
    "lark>=1.1.0,<2",
    # === Skyvern 隐式依赖（HTML 解析 / YAML / HTTP 客户端） ===
    "lxml>=5.1.0,<6",
    "pyyaml>=6.0.1,<7",
    "beautifulsoup4>=4.12.0,<5",
    "requests>=2.31.0,<3",
    # === Skyvern 隐式依赖（OTP 认证 / Google Cloud Auth） ===
    "pyotp>=2.9.0,<3",
    "google-auth>=2.35.0,<3",
    # === Skyvern 隐式依赖（数据校验 / Token / PDF / 缓存 / URL 解析） ===
    "email-validator>=2.1.0,<3",
    "jsonschema>=4.21.0,<5",
    "tiktoken>=0.7.0,<1",
    "rich>=13.7.0,<14",
    "starlette-context>=0.3.0,<1",
    "tldextract>=5.1.0,<6",
    "cachetools>=5.3.0,<6",
    "pdfplumber>=0.11.0,<2",
    "pypdf>=4.2.0,<6",
    "zstandard>=0.22.0,<1",
    "yarl>=1.9.0,<2",
    "multidict>=6.0.0,<7",
    "charset-normalizer>=3.3.0,<4",
    "asyncache>=0.3.0,<1",
    "libcst>=1.4.0,<2",
    # === Skyvern 隐式依赖（MCP / 遥测） ===
    "fastmcp>=0.1.0,<3",
    "lmnr>=0.4.0,<1",
    # === Skyvern 隐式依赖（Azure Blob / Key Vault / Identity） ===
    "azure-storage-blob>=12.20.0,<13",
    "azure-core>=1.30.0,<2",
    "azure-identity>=1.16.0,<2",
    "azure-keyvault-secrets>=4.8.0,<5",
    # === Skyvern 隐式依赖（系统进程 / AWS SDK） ===
    "psutil>=5.9.0,<7",
    "boto3>=1.34.0,<2",
    "botocore>=1.34.0,<2",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "fakeredis>=2.26.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM", "ASYNC"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "skyvern", "onepassword"]
